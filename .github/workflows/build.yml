name: Build

# Run manually from GitHub: Actions -> Build -> "Run workflow" (choose any branch).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64     – release keystore (.jks) encoded with base64
#   KEYSTORE_PASSWORD   – keystore password
#   KEY_ALIAS           – key alias
#   KEY_PASSWORD        – key password
# The same key must be used for every build, otherwise Android refuses to update the app.
on:
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret – see the comment at the top of this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build Android App (release)
        env:
          DZIENNICZEK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          DZIENNICZEK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DZIENNICZEK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DZIENNICZEK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease

      - name: Rename APK
        run: cp composeApp/build/outputs/apk/release/composeApp-release.apk dzienniczek.apk

      # archive: false uploads the APK itself, so the download is dzienniczek.apk (no zip).
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dzienniczek.apk
          archive: false
          retention-days: 14
