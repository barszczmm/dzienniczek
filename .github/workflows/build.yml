name: Build

# Run manually from GitHub: Actions -> Build -> "Run workflow" (choose any branch).
on:
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android App
        run: ./gradlew :composeApp:assembleDebug

      - name: Rename APK
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk dzienniczek.apk

      # archive: false uploads the APK itself, so the download is dzienniczek.apk (no zip).
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: dzienniczek.apk
          archive: false
          retention-days: 14
